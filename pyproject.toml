[project]
name = "studysphere"
version = "0.1.0"
description = "AI-powered student learning platform: documents, quizzes, flashcards, assistant and analytics."
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Login>=0.6.3,<0.7",
    "Flask-WTF>=1.2,<2",
    "google-genai>=1.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2,<4",
]
