<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b5bd6' stroke-width='2'%3E%3Cpath d='M22 10v6M2 10l10-5 10 5-10 5z'/%3E%3Cpath d='M6 12v5c3 3 9 3 12 0v-5'/%3E%3C/svg%3E">
  <title>{% block title %}Log in{% endblock %} · StudySphere</title>
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<main class="auth-wrap">
  <div class="auth-brand">
    <span class="brand-mark"><i data-lucide="graduation-cap"></i></span>
    <span>StudySphere</span>
  </div>
  <div class="card auth-card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="banner banner-{{ 'error' if category == 'error' else ('success' if category == 'success' else 'info') }}" role="status">
        <span>{{ message }}</span>
      </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
  <button class="link-btn muted small" type="button" data-theme-toggle>Toggle dark mode</button>
</main>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
</body>
</html>
