{% extends "base.html" %}
{% block title %}Flashcards{% endblock %}
{% block heading %}Flashcards{% endblock %}
{% block content %}
<div class="split split-wide">
  <section class="card">
    <div class="card-head"><h2>Create a deck</h2></div>
    <form id="deck-form" class="form-stack">
      <label class="field">
        <span>Source document</span>
        <select class="input select" name="document_id" id="doc-select" data-preselect="{{ preselect or '' }}" required>
          <option value="">Loading documents…</option>
        </select>
      </label>
      <label class="field">
        <span>Number of cards</span>
        <input class="input" type="number" name="count" min="3" max="40" value="15" required>
      </label>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit" id="deck-btn"><i data-lucide="sparkles"></i><span>Generate deck</span></button>
      </div>
      <p class="muted small" id="deck-status" role="status"></p>
    </form>
  </section>

  <section class="card">
    <div class="card-head"><h2>Your decks</h2></div>
    <div id="deck-list" class="list">
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line"></div>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/flashcards.js') }}"></script>
{% endblock %}
