{% extends "base.html" %}
{% block title %}{{ deck.title }}{% endblock %}
{% block heading %}{{ deck.title }}{% endblock %}
{% block content %}
<a class="back-link small" href="{{ url_for('pages.flashcards') }}"><i data-lucide="arrow-left"></i> All decks</a>

<div id="deck-root" data-deck-id="{{ deck.id }}" class="deck-root">

</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/deck.js') }}"></script>
{% endblock %}
