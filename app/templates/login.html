{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1 class="auth-title">Welcome back</h1>
<p class="muted">Log in to continue your study sessions.</p>

<form method="post" class="form-stack js-submit" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field">
    <span>Email</span>
    <input class="input" type="email" name="email" autocomplete="email" required autofocus>
  </label>
  <label class="field">
    <span>Password</span>
    <input class="input" type="password" name="password" autocomplete="current-password" required>
  </label>
  <label class="check">
    <input type="checkbox" name="remember" value="1"> <span>Keep me logged in</span>
  </label>
  <button class="btn btn-primary btn-block" type="submit">Log in</button>
</form>

<p class="auth-switch muted">New to StudySphere? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
